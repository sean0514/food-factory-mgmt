<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 220px; background: #1f2937; color: #fff; padding: 16px 0; flex-shrink: 0; }
  #sidebar h1 { font-size: 16px; padding: 0 16px 16px; border-bottom: 1px solid #374151; margin: 0 0 8px; }
  #sidebar a { display: block; color: #d1d5db; text-decoration: none; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  #sidebar a:hover, #sidebar a.active { background: #374151; color: #fff; }
  #sidebar .group-title { padding: 8px 16px 4px; font-size: 12px; color: #9ca3af; margin-top: 8px; }
  #main { flex: 1; padding: 20px; overflow-x: auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #e5e7eb; padding: 6px 10px; font-size: 13px; text-align: left; }
  th { background: #f3f4f6; }
  button { cursor: pointer; padding: 6px 12px; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; font-size: 13px; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 6px; padding: 20px; width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal label { display: block; font-size: 13px; margin: 8px 0 2px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; }
  .card { background: #fff; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 6px; padding: 16px; min-width: 160px; }
  .stat .num { font-size: 22px; font-weight: bold; }
  .login-box { max-width: 320px; margin: 100px auto; background: #fff; padding: 24px; border-radius: 6px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text], input[type=search] { padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var state = { token: null, user: null, permissions: {}, data: {}, page: 'dashboard' };

function callServer(fnName, args) {
  return new Promise(function(resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e) { reject(e); });
    runner[fnName].apply(runner, args || []);
  });
}

var NAV = [
  {key: 'dashboard', label: '儀表板'},
  {type: 'group', label: '原料與庫存', items: [
    {key: 'materials', label: '原料主檔'},
    {key: 'suppliers', label: '供應商'},
    {key: 'purchases', label: '進貨單'}
  ]},
  {type: 'group', label: '生產管理', items: [
    {key: 'productionBatches', label: '生產批次'},
    {key: 'productionExpenses', label: '生產費用'}
  ]},
  {type: 'group', label: '成品與出貨', items: [
    {key: 'products', label: '成品主檔'},
    {key: 'customers', label: '客戶主檔'},
    {key: 'productInventory', label: '成品庫存'},
    {key: 'shipments', label: '出貨單'},
    {key: 'customerInvoices', label: '客戶請款明細'}
  ]},
  {type: 'group', label: '品質/食安', items: [
    {key: 'qcTemplates', label: '檢驗範本'},
    {key: 'qcRecords', label: '檢驗紀錄'}
  ]},
  {key: 'costAnalysis', label: '成本分析'},
  {key: 'pettyCash', label: '零用金對帳'},
  {type: 'group', label: '損益表', items: [
    {key: 'incomeStatement', label: '損益表'},
    {key: 'accountCategories', label: '科目設定'},
    {key: 'manualLedgerEntries', label: '手動分類帳'},
    {key: 'partners', label: '合夥人設定'}
  ]},
  {key: 'users', label: '使用人員'}
];

function pageModuleKey(page) {
  var map = {
    materials: 'inventory', suppliers: 'inventory', purchases: 'inventory',
    productionBatches: 'production', productionExpenses: 'production',
    products: 'shipping', customers: 'shipping', shipments: 'shipping', productInventory: 'shipping',
    customerInvoices: 'billing', qcTemplates: 'qc', qcRecords: 'qc', qcTemplateItems: 'qc',
    costAnalysis: 'cost', pettyCash: 'pettyCash', expenseCategories: 'pettyCash',
    incomeStatement: 'incomeStatement', partners: 'incomeStatement',
    accountCategories: 'incomeStatement', manualLedgerEntries: 'incomeStatement', users: 'users'
  };
  return map[page] || page;
}
function canView(page) { return ['edit','view'].indexOf(state.permissions[pageModuleKey(page)]) !== -1; }
function canEdit(page) { return state.permissions[pageModuleKey(page)] === 'edit'; }

function render() {
  var app = document.getElementById('app');
  if (!state.token) { app.innerHTML = renderLogin(); wireLogin(); return; }
  app.innerHTML = renderShell();
  wireShell();
}

function renderLogin() {
  return '<div class="login-box"><h2>食品工廠管理系統</h2>' +
    '<label>帳號</label><input id="loginUser" type="text">' +
    '<label>密碼</label><input id="loginPass" type="password">' +
    '<div id="loginErr" style="color:#dc2626;font-size:13px;margin-top:6px;"></div>' +
    '<button class="primary" id="loginBtn" style="margin-top:12px;width:100%;">登入</button></div>';
}
function wireLogin() {
  document.getElementById('loginBtn').onclick = function() {
    var u = document.getElementById('loginUser').value;
    var p = document.getElementById('loginPass').value;
    callServer('login', [u, p]).then(function(res) {
      state.token = res.token; state.user = res.user;
      loadAll();
    }).catch(function(e) { document.getElementById('loginErr').innerText = e.message || e; });
  };
}

function loadAll() {
  return callServer('getAllData', [state.token]).then(function(d) {
    state.permissions = d.permissions;
    state.data = d;
    render();
  });
}

function renderShell() {
  var navHtml = NAV.map(function(item) {
    if (item.type === 'group') {
      var visible = item.items.filter(function(i) { return canView(i.key); });
      if (!visible.length) return '';
      return '<div class="group-title">' + item.label + '</div>' +
        visible.map(function(i) {
          return '<a data-page="' + i.key + '" class="' + (state.page === i.key ? 'active' : '') + '">' + i.label + '</a>';
        }).join('');
    }
    if (!canView(item.key)) return '';
    return '<a data-page="' + item.key + '" class="' + (state.page === item.key ? 'active' : '') + '">' + item.label + '</a>';
  }).join('');
  return '<div id="sidebar"><h1>食品工廠管理系統</h1>' + navHtml + '</div>' +
    '<div id="main"><div class="topbar"><div>登入者：' + state.user.name + '（' + state.user.role + '）</div>' +
    '<button id="logoutBtn">登出</button></div><div id="pageRoot"></div></div>';
}

function wireShell() {
  document.querySelectorAll('#sidebar a').forEach(function(a) {
    a.onclick = function() { state.page = a.getAttribute('data-page'); render(); renderPage(); };
  });
  document.getElementById('logoutBtn').onclick = function() { state.token = null; render(); };
  renderPage();
}

// ============ 通用列表頁設定 ============
var GENERIC_PAGES = {
  materials: {table: 'materials', title: '原料主檔', addFn: 'genericAdd', args: ['materials'],
    fields: [
      {key: 'name', label: '原料名稱'}, {key: 'category', label: '分類'}, {key: 'unit', label: '單位'},
      {key: 'safetyStock', label: '安全庫存量', type: 'number'}, {key: 'storageCondition', label: '儲存條件'}, {key: 'note', label: '備註'}
    ]},
  suppliers: {table: 'suppliers', title: '供應商', addFn: 'genericAdd', args: ['suppliers'],
    fields: [
      {key: 'name', label: '供應商名稱'}, {key: 'contact', label: '聯絡人'}, {key: 'phone', label: '電話'},
      {key: 'address', label: '地址'}, {key: 'taxId', label: '統編'}
    ]},
  products: {table: 'products', title: '成品主檔', addFn: 'genericAdd', args: ['products'],
    fields: [
      {key: 'name', label: '品名'}, {key: 'spec', label: '規格'}, {key: 'unit', label: '單位'},
      {key: 'shelfLifeDays', label: '保存期限(天)', type: 'number'}, {key: 'price', label: '售價', type: 'number'}
    ]},
  customers: {table: 'customers', title: '客戶主檔', addFn: 'genericAdd', args: ['customers'],
    fields: [
      {key: 'name', label: '客戶名稱'}, {key: 'contact', label: '聯絡人'}, {key: 'phone', label: '電話'},
      {key: 'address', label: '地址'}, {key: 'taxId', label: '統編'}
    ]},
  productionExpenses: {table: 'productionExpenses', title: '生產費用', addFn: 'genericAdd', args: ['productionExpenses'],
    fields: [
      {key: 'batchNo', label: '生產批號（留空＝當月共同費用）'}, {key: 'month', label: '月份 YYYY-MM'},
      {key: 'type', label: '費用類型'}, {key: 'amount', label: '金額', type: 'number'}, {key: 'note', label: '備註'}
    ]},
  partners: {table: 'partners', title: '合夥人設定', addFn: 'genericAdd', args: ['partners'],
    fields: [{key: 'name', label: '合夥人姓名'}, {key: 'sharePct', label: '分潤比例(%)', type: 'number'}]},
  expenseCategories: {table: 'expenseCategories', title: '零用金類別設定', addFn: 'genericAdd', args: ['expenseCategories'],
    fields: [{key: 'name', label: '類別名稱'}, {key: 'linkInventory', label: '連動原料庫存(true/false)'}]},
  accountCategories: {table: 'accountCategories', title: '損益表科目設定', addFn: 'genericAdd', args: ['accountCategories'],
    fields: [
      {key: 'name', label: '科目名稱'}, {key: 'type', label: '類型（收入/變動成本/固定成本/稅金）'},
      {key: 'source', label: '資料來源（auto/manual）'},
      {key: 'autoSource', label: '自動來源（shipmentIncome/materialCost/pettyCashOther/productionExpense）'}
    ]},
  manualLedgerEntries: {table: 'manualLedgerEntries', title: '損益表手動分類帳', addFn: 'genericAdd', args: ['manualLedgerEntries'],
    fields: [
      {key: 'month', label: '月份 YYYY-MM'}, {key: 'categoryId', label: '科目ID'},
      {key: 'counterparty', label: '對象'}, {key: 'amount', label: '金額', type: 'number'}, {key: 'note', label: '備註'}
    ]}
};

function renderPage() {
  var root = document.getElementById('pageRoot');
  if (!root) return;
  var page = state.page;
  if (page === 'dashboard') return renderDashboard(root);
  if (page === 'qcTemplates') return renderQcTemplates(root);
  if (GENERIC_PAGES[page]) return renderGenericList(root, page);
  if (page === 'purchases') return renderPurchases(root);
  if (page === 'productionBatches') return renderProductionBatches(root);
  if (page === 'productInventory') return renderProductInventory(root);
  if (page === 'shipments') return renderShipments(root);
  if (page === 'customerInvoices') return renderInvoices(root);
  if (page === 'qcRecords') return renderQcRecords(root);
  if (page === 'costAnalysis') return renderCostAnalysis(root);
  if (page === 'pettyCash') return renderPettyCash(root);
  if (page === 'incomeStatement') return renderIncomeStatement(root);
  if (page === 'users') return renderUsers(root);
  root.innerHTML = '<p>頁面開發中</p>';
}

function fmt(n) { return (Number(n) || 0).toLocaleString(undefined, {maximumFractionDigits: 2}); }

// ============ CSV 匯出（通用） ============
function exportRowsToCsv(filename, columns, rows) {
  var lines = [columns.map(function(c) { return c.label; }).join(',')];
  rows.forEach(function(r) {
    lines.push(columns.map(function(c) {
      var v = r[c.key] === undefined || r[c.key] === null ? '' : String(r[c.key]);
      if (v.indexOf(',') !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    }).join(','));
  });
  var blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// 簡易 CSV parser：支援雙引號包住、逗號/換行跳脫
function parseCsv(text) {
  var rows = []; var row = []; var field = ''; var inQuotes = false;
  text = text.replace(/^﻿/, ''); // 去掉 BOM
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else { field += ch; }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function(r) { return r.length > 1 || (r.length === 1 && r[0] !== ''); });
}

// 匯入 CSV：表頭要跟匯出格式一致（欄位標籤），逐列呼叫 genericAdd 新增
function importCsvToPage(page, cfg, file, onDone) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCsv(e.target.result);
    if (rows.length < 2) { alert('CSV 沒有資料列'); return; }
    var header = rows[0].map(function(h) { return h.split('（')[0]; });
    var dataRows = rows.slice(1);
    var idx = 0, okCount = 0, failMsgs = [];
    function next() {
      if (idx >= dataRows.length) {
        alert('匯入完成：成功 ' + okCount + ' 筆' + (failMsgs.length ? '，失敗 ' + failMsgs.length + ' 筆：\n' + failMsgs.join('\n') : ''));
        onDone();
        return;
      }
      var cols = dataRows[idx];
      var data = {};
      cfg.fields.forEach(function(f) {
        var colIdx = header.indexOf(f.label.split('（')[0]);
        data[f.key] = colIdx !== -1 ? (cols[colIdx] || '') : '';
      });
      callServer('genericAdd', [state.token, page, data]).then(function() {
        okCount++; idx++; next();
      }).catch(function(err) {
        failMsgs.push('第 ' + (idx + 2) + ' 列：' + (err.message || err)); idx++; next();
      });
    }
    next();
  };
  reader.readAsText(file, 'utf-8');
}

// ============ 通用列表 CRUD ============
function renderGenericList(root, page) {
  var cfg = GENERIC_PAGES[page];
  var rows = state.data[cfg.table] || [];
  var editable = canEdit(page);
  root.innerHTML = '<div class="card"><div class="toolbar">' +
    '<h2 style="margin:0;flex:1;">' + cfg.title + '</h2>' +
    '<button id="exportBtn">匯出CSV</button>' +
    (editable ? '<button id="importBtn">匯入CSV</button><input type="file" id="importFile" accept=".csv" style="display:none;">' : '') +
    (editable ? '<button class="primary" id="addBtn">新增</button>' : '') +
    '</div><table><thead><tr>' +
    cfg.fields.map(function(f) { return '<th>' + f.label.split('（')[0] + '</th>'; }).join('') +
    (editable ? '<th></th>' : '') + '</tr></thead><tbody>' +
    rows.map(function(r) {
      return '<tr>' + cfg.fields.map(function(f) { return '<td>' + (r[f.key] || '') + '</td>'; }).join('') +
        (editable ? '<td><button data-edit="' + r.id + '">編輯</button> <button class="danger" data-del="' + r.id + '">刪除</button></td>' : '') +
        '</tr>';
    }).join('') + '</tbody></table></div>';
  document.getElementById('exportBtn').onclick = function() {
    exportRowsToCsv(cfg.title + '.csv', cfg.fields, rows);
  };
  if (editable) {
    document.getElementById('importBtn').onclick = function() { document.getElementById('importFile').click(); };
    document.getElementById('importFile').onchange = function(e) {
      if (!e.target.files.length) return;
      importCsvToPage(page, cfg, e.target.files[0], loadAll);
    };
    document.getElementById('addBtn').onclick = function() { openGenericForm(page, null); };
    root.querySelectorAll('[data-edit]').forEach(function(b) {
      b.onclick = function() {
        var id = b.getAttribute('data-edit');
        openGenericForm(page, rows.filter(function(r) { return String(r.id) === id; })[0]);
      };
    });
    root.querySelectorAll('[data-del]').forEach(function(b) {
      b.onclick = function() {
        if (!confirm('確定刪除？')) return;
        callServer('genericDelete', [state.token, page, b.getAttribute('data-del')]).then(loadAll);
      };
    });
  }
}

function openGenericForm(page, existing) {
  var cfg = GENERIC_PAGES[page];
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><h3>' + (existing ? '編輯' : '新增') + cfg.title + '</h3>' +
    cfg.fields.map(function(f) {
      return '<label>' + f.label + '</label><input data-field="' + f.key + '" type="' + (f.type || 'text') + '" value="' +
        (existing ? (existing[f.key] || '') : '') + '">';
    }).join('') +
    '<div style="margin-top:16px;text-align:right;"><button id="cancelBtn">取消</button> ' +
    '<button class="primary" id="saveBtn">儲存</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelBtn').onclick = function() { overlay.remove(); };
  overlay.querySelector('#saveBtn').onclick = function() {
    var data = {};
    cfg.fields.forEach(function(f) {
      data[f.key] = overlay.querySelector('[data-field="' + f.key + '"]').value;
    });
    var call = existing ? callServer('genericUpdate', [state.token, page, existing.id, data])
      : callServer('genericAdd', [state.token, page, data]);
    call.then(function() { overlay.remove(); loadAll(); }).catch(function(e) { alert(e.message || e); });
  };
}

// ============ 儀表板 ============
function renderDashboard(root) {
  root.innerHTML = '<div class="cards">' +
    '<div class="stat"><div>原料種類</div><div class="num">' + (state.data.materials || []).length + '</div></div>' +
    '<div class="stat"><div>生產批次數</div><div class="num">' + (state.data.productionBatches || []).length + '</div></div>' +
    '<div class="stat"><div>客戶數</div><div class="num">' + (state.data.customers || []).length + '</div></div>' +
    '<div class="stat"><div>未收款請款單</div><div class="num">' +
    (state.data.customerInvoices || []).filter(function(i) { return i.status !== '已收款'; }).length + '</div></div>' +
    '</div>';
}

// ============ 進貨單 ============
function renderPurchases(root) {
  var rows = state.data.purchases || [];
  var materials = state.data.materials || [];
  var suppliers = state.data.suppliers || [];
  var editable = canEdit('purchases');
  function matName(id) { var m = materials.filter(function(x){return String(x.id)===String(id);})[0]; return m ? m.name : id; }
  function supName(id) { var s = suppliers.filter(function(x){return String(x.id)===String(id);})[0]; return s ? s.name : id; }
  root.innerHTML = '<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1;">進貨單</h2>' +
    '<button id="exportBtn">匯出CSV</button>' +
    (editable ? '<button class="primary" id="addBtn">新增進貨</button>' : '') + '</div>' +
    '<table><thead><tr><th>日期</th><th>供應商</th><th>原料</th><th>批號</th><th>數量</th><th>單價</th><th>金額</th><th>效期</th><th>驗收</th>' +
    (editable ? '<th></th>' : '') + '</tr></thead><tbody>' +
    rows.map(function(r) {
      return '<tr><td>' + r.date + '</td><td>' + supName(r.supplierId) + '</td><td>' + matName(r.materialId) + '</td>' +
        '<td>' + r.batchNo + '</td><td>' + r.quantity + '</td><td>' + fmt(r.unitPrice) + '</td><td>' + fmt(r.amount) +
        '</td><td>' + (r.expiryDate || '') + '</td><td>' + (r.inspectionStatus || '') + '</td>' +
        (editable ? '<td><button data-edit="' + r.id + '">編輯</button> <button class="danger" data-del="' + r.id + '">刪除</button></td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>';
  document.getElementById('exportBtn').onclick = function() {
    exportRowsToCsv('進貨單.csv',
      [{key:'date',label:'日期'},{key:'supplierId',label:'供應商ID'},{key:'materialId',label:'原料ID'},{key:'batchNo',label:'批號'},
       {key:'quantity',label:'數量'},{key:'unitPrice',label:'單價'},{key:'amount',label:'金額'},{key:'expiryDate',label:'效期'},{key:'inspectionStatus',label:'驗收狀態'}],
      rows);
  };
  if (editable) {
    document.getElementById('addBtn').onclick = function() { openPurchaseForm(materials, suppliers, null); };
    root.querySelectorAll('[data-edit]').forEach(function(b) {
      b.onclick = function() { openPurchaseForm(materials, suppliers, rows.filter(function(r) { return String(r.id) === b.getAttribute('data-edit'); })[0]); };
    });
    root.querySelectorAll('[data-del]').forEach(function(b) {
      b.onclick = function() {
        if (!confirm('刪除這筆進貨紀錄？（不會反向調整已經產生的庫存異動紀錄）')) return;
        callServer('genericDelete', [state.token, 'purchases', b.getAttribute('data-del')]).then(loadAll);
      };
    });
  }
}
function openPurchaseForm(materials, suppliers, existing) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

function openShipmentForm(products, customers, existing) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var isEdit = !!existing;
  var inventory = state.data.productInventory || [];
  function batchOptionsFor(productId) {
    var avail = inventory.filter(function(i) { return String(i.productId) === String(productId) && Number(i.quantity) > 0; });
    if (!avail.length) return '<option value="">（無可出貨庫存，請先完成生產入庫）</option>';
    return avail.map(function(i) { return '<option value="' + i.batchNo + '" data-stock="' + i.quantity + '">' + i.batchNo + '（庫存 ' + i.quantity + '）</option>'; }).join('');
  }
  overlay.innerHTML = '<div class="modal"><h3>' + (isEdit ? '編輯出貨：' + existing.shipmentNo : '新增出貨') + '</h3>' +
    (isEdit ? '<p style="color:#888;font-size:12px;">客戶/成品/批號/數量為避免庫存對不起來，不開放編輯；要改請刪除後重新新增。</p>' : '') +
    '<label>客戶' + (isEdit ? '（不可改）' : '') + '</label><select id="f_customerId" ' + (isEdit ? 'disabled' : '') + '>' +
      customers.map(function(c){return '<option value="'+c.id+'"' + (isEdit && String(existing.customerId)===String(c.id) ? ' selected' : '') + '>'+c.name+'</option>';}).join('') + '</select>' +
    (isEdit ? ('<label>成品批號（不可改）</label><input type="text" value="' + existing.batchNo + '" disabled>') :
      ('<label>成品</label><select id="f_productId">' + products.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('') + '</select>' +
       '<label>成品批號</label><select id="f_batchNo">' + batchOptionsFor(products[0] && products[0].id) + '</select>')) +
    '<label>出貨日期</label><input id="f_date" type="date" value="' + (isEdit ? existing.date : new Date().toISOString().slice(0,10)) + '">' +
    (isEdit ? ('<label>數量（不可改）</label><input type="number" value="' + existing.quantity + '" disabled>') :
      '<label>數量（庫存上限見批號旁備註）</label><input id="f_quantity" type="number">') +
    '<label>單價</label><input id="f_unitPrice" type="number" value="' + (isEdit ? existing.unitPrice : '') + '">' +
    '<label>稅金</label><input id="f_tax" type="number" value="' + (isEdit ? (existing.tax||0) : '0') + '">' +
    '<label>備註</label><input id="f_note" type="text" value="' + (isEdit ? (existing.note||'') : '') + '">' +
    '<div style="margin-top:16px;text-align:right;"><button id="cancelBtn">取消</button> <button class="primary" id="saveBtn">儲存</button></div></div>';
  document.body.appendChild(overlay);
  if (!isEdit) {
    overlay.querySelector('#f_productId').onchange = function(e) {
      overlay.querySelector('#f_batchNo').innerHTML = batchOptionsFor(e.target.value);
    };
  }
  overlay.querySelector('#cancelBtn').onclick = function() { overlay.remove(); };
  overlay.querySelector('#saveBtn').onclick = function() {
    if (isEdit) {
      var patch = {
        date: overlay.querySelector('#f_date').value, unitPrice: overlay.querySelector('#f_unitPrice').value,
        tax: overlay.querySelector('#f_tax').value, note: overlay.querySelector('#f_note').value
      };
      callServer('updateShipment', [state.token, existing.id, patch]).then(function() { overlay.remove(); loadAll(); }).catch(function(e){alert(e.message||e);});
      return;
    }
    var batchSelect = overlay.querySelector('#f_batchNo');
    var chosen = batchSelect.options[batchSelect.selectedIndex];
    var stock = chosen ? Number(chosen.getAttribute('data-stock')) || 0 : 0;
    var qty = Number(overlay.querySelector('#f_quantity').value) || 0;
    if (qty > stock) { alert('數量超過該批號庫存（' + stock + '）'); return; }
    var data = {
      customerId: overlay.querySelector('#f_customerId').value,
      productId: overlay.querySelector('#f_productId').value,
      date: overlay.querySelector('#f_date').value,
      batchNo: batchSelect.value,
      quantity: qty,
      unitPrice: overlay.querySelector('#f_unitPrice').value,
      tax: overlay.querySelector('#f_tax').value,
      note: overlay.querySelector('#f_note').value
    };
    callServer('addShipment', [state.token, data]).then(function() { overlay.remove(); loadAll(); }).catch(function(e){alert(e.message||e);});
  };
}

function openQcForm(templates) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var allItems = state.data.qcTemplateItems || [];
  function itemsFieldHtml(templateId) {
    var tplItems = allItems.filter(function(i) { return String(i.templateId) === String(templateId); });
    if (!tplItems.length) return '<p style="color:#888;">此範本尚未設定檢驗項目，請先到「檢驗範本」頁面新增。</p>';
    return tplItems.map(function(it) {
      var inputHtml;
      if (it.dataType === '合格判定') {
        inputHtml = '<select class="qc_item_value" data-tplitem="' + it.id + '"><option value="合格">合格</option><option value="不合格">不合格</option></select>';
      } else if (it.dataType === '數值') {
        inputHtml = '<input type="number" class="qc_item_value" data-tplitem="' + it.id + '" placeholder="標準：' + (it.spec || '不限') + '">';
      } else {
        inputHtml = '<input type="text" class="qc_item_value" data-tplitem="' + it.id + '">';
      }
      return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">' +
        '<span style="flex:1;">' + it.itemName + (it.spec ? '（' + it.spec + '）' : '') + '</span>' +
        '<span style="flex:1;">' + inputHtml + '</span></div>';
    }).join('');
  }
  overlay.innerHTML = '<div class="modal"><h3>新增檢驗紀錄</h3>' +
    '<label>範本</label><select id="f_templateId">' + templates.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>';}).join('') + '</select>' +
    '<label>關聯批號</label><input id="f_refBatchNo" type="text">' +
    '<label>檢驗人</label><input id="f_inspector" type="text">' +
    '<label>日期</label><input id="f_date" type="date" value="' + new Date().toISOString().slice(0,10) + '">' +
    '<div style="margin-top:12px;"><b>檢驗項目</b><div id="qcItemsWrap" style="margin-top:6px;">' +
    itemsFieldHtml(templates[0] && templates[0].id) + '</div></div>' +
    '<div style="margin-top:16px;text-align:right;"><button id="cancelBtn">取消</button> <button class="primary" id="saveBtn">儲存</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#f_templateId').onchange = function(e) {
    overlay.querySelector('#qcItemsWrap').innerHTML = itemsFieldHtml(e.target.value);
  };
  overlay.querySelector('#cancelBtn').onclick = function() { overlay.remove(); };
  overlay.querySelector('#saveBtn').onclick = function() {
    var items = [];
    overlay.querySelectorAll('.qc_item_value').forEach(function(el) {
      items.push({templateItemId: el.getAttribute('data-tplitem'), value: el.value});
    });
    if (!items.length) { alert('此範本沒有檢驗項目，無法送出'); return; }
    var record = {
      templateId: overlay.querySelector('#f_templateId').value,
      refBatchNo: overlay.querySelector('#f_refBatchNo').value,
      inspector: overlay.querySelector('#f_inspector').value,
      date: overlay.querySelector('#f_date').value
    };
    callServer('addQcRecord', [state.token, record, items]).then(function() { overlay.remove(); loadAll(); }).catch(function(e){alert(e.message||e);});
  };
}

// ============ 成本分析 ============
function renderCostAnalysis(root) {
  var month = (root.dataset && root.dataset.month) || new Date().toISOString().slice(0,7);
  var materials = state.data.materials || [];
  root.innerHTML = '<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1;">成本分析 — 月度批次成本</h2><button id="costExportBtn">匯出CSV</button></div>' +
    '<label>月份</label><input type="month" id="costMonth" value="' + month + '">' +
    '<div id="costReport" style="margin-top:12px;"></div></div>' +
    '<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1;">原料成本波動追蹤</h2><button id="trendExportBtn">匯出CSV</button></div>' +
    '<label>原料</label><select id="trendMaterial">' + materials.map(function(m){return '<option value="'+m.id+'">'+m.name+'</option>';}).join('') + '</select>' +
    '<div id="trendReport" style="margin-top:12px;"></div></div>';
  function load(m) {
    callServer('monthlyCostReport', [state.token, m]).then(function(res) {
      var el = document.getElementById('costReport');
      el.innerHTML = '<table><thead><tr><th>批號</th><th>原料成本</th><th>直接費用</th><th>分攤共同費用</th><th>總成本</th><th>實際產量</th><th>單位成本</th><th>售價</th><th>單位毛利</th></tr></thead><tbody>' +
        res.rows.map(function(r) {
          return '<tr><td>' + r.batchNo + '</td><td>' + fmt(r.materialCost) + '</td><td>' + fmt(r.directExpense) + '</td><td>' + fmt(r.commonExpense) +
            '</td><td>' + fmt(r.totalCost) + '</td><td>' + r.actualQty + '</td><td>' + fmt(r.unitCost) + '</td><td>' + fmt(r.price) + '</td><td>' + fmt(r.unitMargin) + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<p style="margin-top:12px;"><b>當月總計</b> — 原料成本：' + fmt(res.totals.materialCost) + '，費用：' + fmt(res.totals.directExpense + res.totals.commonExpense) +
        '，總成本：' + fmt(res.totals.totalCost) + '</p>';
      document.getElementById('costExportBtn').onclick = function() {
        exportRowsToCsv('成本分析_' + m + '.csv',
          [{key:'batchNo',label:'批號'},{key:'materialCost',label:'原料成本'},{key:'directExpense',label:'直接費用'},{key:'commonExpense',label:'分攤共同費用'},
           {key:'totalCost',label:'總成本'},{key:'actualQty',label:'實際產量'},{key:'unitCost',label:'單位成本'},{key:'price',label:'售價'},{key:'unitMargin',label:'單位毛利'}],
          res.rows);
      };
    });
  }
  function loadTrend(materialId) {
    callServer('materialPriceTrend', [state.token, materialId]).then(function(rows) {
      var el = document.getElementById('trendReport');
      document.getElementById('trendExportBtn').onclick = function() {
        exportRowsToCsv('原料成本波動.csv', [{key:'date',label:'進貨日期'},{key:'purchaseNo',label:'進貨單號'},{key:'batchNo',label:'批號'},{key:'unitPrice',label:'單價'}], rows);
      };
      if (!rows.length) { el.innerHTML = '<p style="color:#888;">此原料尚無進貨紀錄</p>'; return; }
      var prices = rows.map(function(r) { return r.unitPrice; });
      var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
      var last = prices[prices.length - 1];
      var changeNote = prices.length > 1 ? ((last - prices[prices.length - 2]) >= 0 ? '↑ 較上次進貨上漲' : '↓ 較上次進貨下跌') : '';
      el.innerHTML = '<p>歷史最低 ' + fmt(min) + '　最高 ' + fmt(max) + '　最近一次 ' + fmt(last) + ' ' + changeNote + '</p>' +
        '<table><thead><tr><th>進貨日期</th><th>進貨單號</th><th>批號</th><th>單價</th></tr></thead><tbody>' +
        rows.map(function(r) { return '<tr><td>' + r.date + '</td><td>' + r.purchaseNo + '</td><td>' + r.batchNo + '</td><td>' + fmt(r.unitPrice) + '</td></tr>'; }).join('') +
        '</tbody></table>';
    });
  }
  document.getElementById('costMonth').onchange = function(e) { load(e.target.value); };
  document.getElementById('trendMaterial').onchange = function(e) { loadTrend(e.target.value); };
  load(month);
  if (materials.length) loadTrend(materials[0].id);
}

  load(year);
}

// ============ 使用人員 ============
function renderUsers(root) {
  var users = state.data.users || [];
  var editable = canEdit('users');
  root.innerHTML = '<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1;">使用人員</h2>' +
    (editable ? '<button class="primary" id="addBtn">新增使用者</button>' : '') + '</div>' +
    '<table><thead><tr><th>帳號</th><th>姓名</th><th>角色</th><th>啟用</th>' + (editable ? '<th></th>' : '') + '</tr></thead><tbody>' +
    users.map(function(u) {
      return '<tr><td>' + u.username + '</td><td>' + u.name + '</td><td>' + u.role + '</td><td>' + (String(u.active) === 'false' ? '否' : '是') + '</td>' +
        (editable ? '<td><button data-edit="' + u.id + '">編輯</button></td>' : '') + '</tr>';
    }).join('') +
    '</tbody></table></div>' + renderPermissionMatrix();
  if (editable) {
    document.getElementById('addBtn').onclick = function() { openUserForm(null); };
    root.querySelectorAll('[data-edit]').forEach(function(b) {
      b.onclick = function() { openUserForm(users.filter(function(u) { return String(u.id) === b.getAttribute('data-edit'); })[0]); };
    });
    wirePermissionMatrix();
  }
}
function openUserForm(existing) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var roles = ['系統管理員', '廠長主管', '倉管人員', '產線人員', '品管人員', '業務出貨人員', '會計人員'];
  var isEdit = !!existing;
  overlay.innerHTML = '<div class="modal"><h3>' + (isEdit ? '編輯使用者：' + existing.username : '新增使用者') + '</h3>' +
    (isEdit ? '' : '<label>帳號</label><input id="f_username" type="text">') +
    '<label>' + (isEdit ? '新密碼（留空表示不改密碼）' : '密碼') + '</label><input id="f_password" type="text">' +
    '<label>姓名</label><input id="f_name" type="text" value="' + (existing ? existing.name : '') + '">' +
    '<label>角色</label><select id="f_role">' + roles.map(function(r){return '<option' + (existing && existing.role === r ? ' selected' : '') + '>'+r+'</option>';}).join('') + '</select>' +
    (isEdit ? '<label><input type="checkbox" id="f_active" style="width:auto;" ' + (String(existing.active) === 'false' ? '' : 'checked') + '> 啟用此帳號' : '') +
    '<div style="margin-top:16px;text-align:right;"><button id="cancelBtn">取消</button> <button class="primary" id="saveBtn">儲存</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelBtn').onclick = function() { overlay.remove(); };
  overlay.querySelector('#saveBtn').onclick = function() {
    var password = overlay.querySelector('#f_password').value;
    if (isEdit) {
      var data = {name: overlay.querySelector('#f_name').value, role: overlay.querySelector('#f_role').value,
        active: overlay.querySelector('#f_active').checked};
      if (password) data.password = password;
      callServer('updateUser', [state.token, existing.id, data]).then(function() { overlay.remove(); loadAll(); }).catch(function(e){alert(e.message||e);});
    } else {
      var data = {username: overlay.querySelector('#f_username').value, password: password,
        name: overlay.querySelector('#f_name').value, role: overlay.querySelector('#f_role').value};
      callServer('addUser', [state.token, data]).then(function() { overlay.remove(); loadAll(); }).catch(function(e){alert(e.message||e);});
    }
  };
}
var PERMISSION_MODULE_LABELS = {
  dashboard: '儀表板', inventory: '原料與庫存', production: '生產管理', shipping: '成品與出貨',
  billing: '客戶請款明細', qc: '品質/食安', cost: '成本分析', pettyCash: '零用金對帳',
  incomeStatement: '損益表', users: '使用人員'
};
function renderPermissionMatrix() {
  if (!state.data.roleMatrix) return '';
  var roles = ['廠長主管', '倉管人員', '產線人員', '品管人員', '業務出貨人員', '會計人員'];
  var modules = Object.keys(PERMISSION_MODULE_LABELS);
  return '<div class="card"><h3>角色權限矩陣（點擊切換 edit → view → none → edit）</h3>' +
    '<table><thead><tr><th>模組</th>' + roles.map(function(r){return '<th>'+r+'</th>';}).join('') + '</tr></thead><tbody>' +
    modules.map(function(m) {
      return '<tr><td>' + PERMISSION_MODULE_LABELS[m] + '</td>' + roles.map(function(r) {
        var lvl = state.data.roleMatrix[m] ? state.data.roleMatrix[m][r] : 'view';
        return '<td><button class="permCell" data-module="' + m + '" data-role="' + r + '">' + lvl + '</button></td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function wirePermissionMatrix() {
  document.querySelectorAll('.permCell').forEach(function(btn) {
    btn.onclick = function() {
      var cur = btn.innerText;
      var next = cur === 'edit' ? 'view' : (cur === 'view' ? 'none' : 'edit');
      callServer('updateRolePermission', [state.token, btn.getAttribute('data-module'), btn.getAttribute('data-role'), next])
        .then(function() { loadAll(); });
    };
  });
}

render();
</script>
</body>
</html>
